<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0c2440" />
  <title>Sin conexión · Servimantos</title>
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh; min-height: 100dvh;
      display: grid; place-items: center;
      padding: max(1.5rem, env(safe-area-inset-top)) 1.5rem max(1.5rem, env(safe-area-inset-bottom));
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: linear-gradient(150deg, #0c2440, #071a30);
      color: #16243a;
    }
    .card {
      width: 100%; max-width: 24rem; text-align: center;
      background: #fff; border-radius: 1.375rem; padding: 2rem 1.5rem;
      box-shadow: 0 1.875rem 4.375rem -1.5rem rgba(0, 0, 0, .45);
    }
    img { width: 4.5rem; height: 4.5rem; margin: 0 auto 1rem; display: block; }
    h1 { font-size: 1.25rem; color: #0c2440; margin-bottom: .5rem; }
    p { color: #51637a; line-height: 1.55; font-size: .95rem; }
    button {
      margin-top: 1.5rem; width: 100%; min-height: 3rem;
      border: 0; border-radius: 999px; cursor: pointer;
      font: inherit; font-weight: 700; color: #fff;
      background: linear-gradient(120deg, #ff6a1a, #ff8a3d 35%, #38bdf8);
    }
  </style>
</head>
<body>
  <main class="card">
    <img src="icons/icon.svg" alt="" />
    <h1>Estás sin conexión</h1>
    <p>El portal necesita internet para cargar y guardar reportes. Revisa la señal y vuelve a intentar.</p>
    <button type="button" onclick="location.reload()">Reintentar</button>
  </main>
</body>
</html>
